<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Nova Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="chrome">
      <div id="tabstrip">
        <div id="tabs"></div>
        <button id="new-tab" class="icon-btn chrome-btn" title="Новая вкладка (Ctrl+T)"></button>
        <div class="drag-fill"></div>
        <div class="window-controls">
          <button id="win-min" class="icon-btn win-btn" title="Свернуть"></button>
          <button id="win-max" class="icon-btn win-btn" title="Развернуть"></button>
          <button id="win-close" class="icon-btn win-btn win-close" title="Закрыть"></button>
        </div>
      </div>
      <div id="toolbar">
        <button id="nav-back" class="icon-btn chrome-btn nav-btn" title="Назад (Alt+Left)"></button>
        <button id="nav-fwd" class="icon-btn chrome-btn nav-btn" title="Вперёд (Alt+Right)"></button>
        <button id="nav-reload" class="icon-btn chrome-btn nav-btn" title="Перезагрузить (Ctrl+R)"></button>
        <button id="nav-home" class="icon-btn chrome-btn nav-btn" title="Домой"></button>
        <div id="addr-wrap">
          <span id="addr-icon"></span>
          <input id="addr" spellcheck="false" autocomplete="off" placeholder="Поиск или адрес">
          <button id="star-btn" class="icon-btn" title="Добавить в закладки (Ctrl+D)"></button>
        </div>
        <button id="btn-bookmarks" class="icon-btn chrome-btn" title="Закладки (Ctrl+B)"></button>
        <button id="btn-history" class="icon-btn chrome-btn" title="История (Ctrl+H)"></button>
        <button id="btn-downloads" class="icon-btn chrome-btn" title="Загрузки (Ctrl+J)">
          <span id="dl-badge" class="badge" hidden></span>
        </button>
        <button id="btn-settings" class="icon-btn chrome-btn" title="Настройки"></button>
      </div>
    </header>
    <main id="stage"><div id="stage-progress"></div></main>
    <div id="perm-modal" hidden>
      <div class="perm-box">
        <div class="perm-icon" id="perm-icon"></div>
        <div class="perm-title" id="perm-title"></div>
        <div class="perm-sub" id="perm-sub"></div>
        <label class="perm-remember"><input type="checkbox" id="perm-remember"> Запомнить для этого сайта</label>
        <div class="perm-actions">
          <button class="btn" id="perm-deny">Отклонить</button>
          <button class="btn primary" id="perm-allow">Разрешить</button>
        </div>
      </div>
    </div>
    <div id="toast" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
