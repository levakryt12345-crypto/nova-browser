<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:">
  <title>Новая вкладка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
  <main class="home-main">
    <div class="home-greet" id="home-greet">Добрый день!</div>
    <h1 class="home-title">С чего начнёте сегодня?</h1>

    <form class="home-search" id="home-search">
      <span class="home-search-ic">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </span>
      <input id="home-q" placeholder="Поиск в интернете или адрес сайта…" spellcheck="false" autocomplete="off">
    </form>

    <div class="home-links" id="home-links"></div>
    <div class="home-bookmarks" id="home-bookmarks" hidden>
      <div class="home-bm-title">Ваши закладки</div>
      <div class="home-bm-grid" id="home-bm-grid"></div>
    </div>

    <div class="home-foot">Nova Browser — быстрый и лёгкий</div>
  </main>
  <script src="home.js"></script>
</body>
</html>
