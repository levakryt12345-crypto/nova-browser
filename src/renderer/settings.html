<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>Настройки — Nova Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-page">
  <div class="set-wrap">
    <h1 class="set-title">Настройки</h1>

    <div class="set-section">
      <h2>Общие</h2>
      <div class="set-field">
        <label for="set-home">Стартовая страница</label>
        <input class="panel-input" id="set-home" spellcheck="false" autocomplete="off" placeholder="nova://home или https://...">
      </div>
      <div class="set-field">
        <label for="set-engine">Поисковик</label>
        <select id="set-engine"></select>
      </div>
      <div class="set-field">
        <label for="set-theme">Тема</label>
        <select id="set-theme">
          <option value="system">Как в системе</option>
          <option value="light">Светлая</option>
          <option value="dark">Тёмная</option>
        </select>
      </div>
      <div class="set-field">
        <label for="set-zoom">Масштаб</label>
        <select id="set-zoom">
          <option value="0.75">75%</option>
          <option value="0.9">90%</option>
          <option value="1">100%</option>
          <option value="1.1">110%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
      </div>
    </div>

    <div class="set-section">
      <h2>Вкладки</h2>
      <label class="set-check">
        <input type="checkbox" id="set-restore-tabs">
        <span>Восстанавливать вкладки после запуска</span>
      </label>
      <label class="set-check">
        <input type="checkbox" id="set-new-blank">
        <span>Новая вкладка — пустая страница</span>
      </label>
    </div>

    <div class="set-section">
      <h2>Приватность</h2>
      <label class="set-check">
        <input type="checkbox" id="set-history">
        <span>Записывать историю посещений</span>
      </label>
      <label class="set-check">
        <input type="checkbox" id="set-dnt">
        <span>Отправлять «Не отслеживать» (DNT)</span>
      </label>
      <label class="set-check">
        <input type="checkbox" id="set-thirdparty">
        <span>Блокировать сторонние cookie</span>
      </label>
    </div>

    <div class="set-section">
      <h2>Разрешения сайтов</h2>
      <div id="perm-list" class="perm-list"></div>
      <div id="perm-empty" class="perm-empty" hidden>Сохранённых разрешений нет.</div>
      <button class="btn small" id="perm-clear-all">Удалить все</button>
    </div>

    <div class="set-section">
      <h2>Загрузки</h2>
      <div class="set-field">
        <label for="set-dl-dir">Папка для файлов</label>
        <div class="row-flex">
          <input class="panel-input" id="set-dl-dir" readonly placeholder="По умолчанию (Загрузки)">
          <button class="btn small" id="set-dl-dir-btn">Выбрать</button>
        </div>
      </div>
    </div>

    <div class="set-section">
      <h2>О браузере</h2>
      <div class="about-line" id="about-line"></div>
      <div class="row-flex">
        <button class="btn small" id="set-default-browser">Сделать браузером по умолчанию</button>
        <button class="btn small" id="set-data-folder">Папка с данными</button>
        <button class="btn small" id="set-clear-hist">Очистить историю</button>
        <button class="btn small danger" id="set-reset">Сбросить настройки</button>
      </div>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
