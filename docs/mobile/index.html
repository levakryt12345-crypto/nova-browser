<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141519">
  <meta name="description" content="Nova Mobile — мобильная версия браузера Nova Browser. Устанавливается на телефон как приложение.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png">
  <title>Nova Mobile</title>
  <style>
    :root {
      --bg: #141519;
      --bg-elev: #1e2027;
      --bg-input: #1b1d24;
      --text: #e9e9ee;
      --text-dim: #9a9da9;
      --text-faint: #6b6f7c;
      --border: #272933;
      --accent: #8d95e3;
      --accent-soft: rgba(141, 149, 227, 0.16);
      --danger: #e26565;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    #chrome {
      padding: calc(env(safe-area-inset-top) + 8px) 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .addr-row { display: flex; gap: 8px; }
    #addr {
      flex: 1;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 21px;
      background: var(--bg-input);
      color: var(--text);
      font-size: 14.5px;
      padding: 0 16px;
      outline: none;
      min-width: 0;
    }
    #addr:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn {
      width: 42px; height: 42px; border: none; border-radius: 12px;
      background: var(--bg-elev); color: var(--text-dim);
      font-size: 17px; flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn:active { background: var(--accent-soft); color: var(--accent); }
    .quick-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .quick-row::-webkit-scrollbar { display: none; }
    .quick {
      white-space: nowrap; padding: 7px 14px; border-radius: 999px;
      background: var(--bg-elev); color: var(--text-dim);
      border: 1px solid var(--border); font-size: 13px; cursor: pointer;
    }
    .quick:active { background: var(--accent-soft); color: var(--accent); }
    #stage { flex: 1; position: relative; background: #fff; }
    iframe {
      width: 100%; height: 100%; border: none;
      position: absolute; inset: 0;
    }
    #fallback {
      display: none;
      position: absolute; inset: 0;
      background: var(--bg);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 30px;
      text-align: center;
      color: var(--text-dim);
      font-size: 14.5px;
      line-height: 1.5;
      z-index: 5;
    }
    #fallback .big { font-size: 40px; }
    #fallback button {
      height: 46px; padding: 0 26px;
      border: none; border-radius: 23px;
      background: var(--accent); color: #171923;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    #install-bar {
      display: none;
      position: fixed; left: 10px; right: 10px;
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      background: var(--bg-elev);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 12px 14px;
      z-index: 20;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
      font-size: 13.5px;
    }
    #install-bar .row { display: flex; align-items: center; gap: 10px; }
    #install-bar img { width: 36px; height: 36px; border-radius: 9px; }
    #install-bar .flex { flex: 1; }
    #install-bar b { font-size: 14px; }
    #install-bar p { color: var(--text-dim); font-size: 12px; }
    #install-bar button {
      height: 34px; padding: 0 16px; border: none; border-radius: 17px;
      background: var(--accent); color: #171923; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    #install-bar .x {
      width: 30px; height: 30px; border: none; background: transparent;
      color: var(--text-faint); font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <header id="chrome">
    <div class="addr-row">
      <input id="addr" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Поиск или адрес">
      <button id="go" class="btn" title="Открыть">➜</button>
    </div>
    <div class="quick-row">
      <button class="quick" data-url="https://www.google.com">Google</button>
      <button class="quick" data-url="https://yandex.ru">Яндекс</button>
      <button class="quick" data-url="https://ru.wikipedia.org">Википедия</button>
      <button class="quick" data-url="https://www.youtube.com">YouTube</button>
      <button class="quick" data-url="https://github.com">GitHub</button>
    </div>
  </header>

  <main id="stage">
    <iframe id="frame" title="Nova Mobile"></iframe>
    <div id="fallback">
      <div class="big">🔗</div>
      <div>Сайт не разрешает открываться во встроенном окне.<br>Откройте его отдельной вкладкой — адрес уже вставлен.</div>
      <button id="open-ext">Открыть в браузере</button>
    </div>
  </main>

  <div id="install-bar" hidden>
    <div class="row">
      <img src="icon-512.png" alt="">
      <div class="flex">
        <b>Nova Mobile</b>
        <p>Установить как приложение</p>
      </div>
      <button id="install-now">Установить</button>
      <button class="x" id="install-close" title="Закрыть">✕</button>
    </div>
  </div>

  <script>
    'use strict';

    const iframe = document.getElementById('frame');
    const addr = document.getElementById('addr');
    const fallback = document.getElementById('fallback');
    const blockedFirst = ['https://www.google.com', 'https://google.com', 'https://youtube.com', 'https://www.youtube.com', 'https://www.facebook.com', 'https://x.com'];

    let pendingUrl = '';
    let blockedTimer = 0;

    function normalize(input) {
      const s = (input || '').trim();
      if (!s) return '';
      if (/^https?:\/\//i.test(s)) return s;
      if (/^[\w-]+(\.[\w-]+)+([/?#][^\s]*)?$/.test(s)) return 'https://' + s;
      return 'https://www.google.com/search?q=' + encodeURIComponent(s);
    }

    function openExternal(url) {
      window.open(url, '_blank', 'noopener');
    }

    function open(url) {
      if (!url) return;
      pendingUrl = url;
      fallback.style.display = 'none';
      if (blockedFirst.some((b) => url.startsWith(b))) {
        showFallback();
        return;
      }
      iframe.onload = null;
      iframe.src = url;
      clearTimeout(blockedTimer);
      blockedTimer = setTimeout(() => {
        try {
          if (!iframe.contentDocument || iframe.contentDocument.body == null) throw new Error('empty');
        } catch {
          showFallback();
        }
      }, 6000);
    }

    function showFallback() {
      clearTimeout(blockedTimer);
      iframe.src = 'about:blank';
      fallback.style.display = 'flex';
    }

    document.getElementById('go').addEventListener('click', () => open(addr.value));
    addr.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') open(addr.value);
    });
    document.querySelectorAll('.quick').forEach((b) => {
      b.addEventListener('click', () => {
        addr.value = b.dataset.url;
        open(b.dataset.url);
      });
    });
    document.getElementById('open-ext').addEventListener('click', () => {
      openExternal(pendingUrl);
      fallback.style.display = 'none';
    });

    iframe.addEventListener('load', () => clearTimeout(blockedTimer));

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const bar = document.getElementById('install-bar');
      if (localStorage.getItem('nova-mobile-install-dismissed') !== '1') bar.hidden = false;
    });
    document.getElementById('install-now').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('install-bar').hidden = true;
    });
    document.getElementById('install-close').addEventListener('click', () => {
      localStorage.setItem('nova-mobile-install-dismissed', '1');
      document.getElementById('install-bar').hidden = true;
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const saved = localStorage.getItem('nova-mobile-last');
    if (saved) open(saved);
    addr.focus();
  </script>
</body>
</html>
